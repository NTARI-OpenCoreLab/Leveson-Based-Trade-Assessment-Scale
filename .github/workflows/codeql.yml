name: CodeQL
# Replaces CodeQL default setup, which never analyzes pull requests from
# forks — leaving contributor PRs permanently blocked by the
# "Require code scanning - main" ruleset (see PR #7).
#
# SAFETY: this runs on pull_request (NOT pull_request_target), so fork PRs
# execute with a read-only token and no secrets. Every language uses
# build-mode: none, so analysis never executes repository code. Keep it that
# way — do not add build steps or switch the trigger to pull_request_target.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'   # weekly Monday, matching default setup's cadence

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Same five languages default setup covered, default query suite.
        language:
          - actions
          - go
          - javascript-typescript
          - python
          - rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: github/codeql-action/init@a2983b8bed1923f44751c5c43237f479442827b3   # v3.37.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@a2983b8bed1923f44751c5c43237f479442827b3   # v3.37.4
        with:
          category: "/language:${{ matrix.language }}"
